---
# Reusable workflow to lint Python code with the Black formatter using reviewdog.
#
# Runs the Black formatter in check mode and posts inline PR annotations via
# reviewdog, so reviewers see formatting issues directly in the diff.
#
# Can be extended for other linters or formatters as needed.
#
# Usage: Reference this workflow from any repo in the OvertureMaps organization.
#
# Example (.github/workflows/lint-python.yml):
#   name: Lint Python
#   on:
#     pull_request:
#       types: [opened, reopened, synchronize]
#   jobs:
#     python-lint:
#       uses: OvertureMaps/workflows/.github/workflows/lint-python.yml@main
#
name: Lint Python

on:
  workflow_call:
    inputs:
      black_version:
        description: "Black formatter version to install"
        required: false
        type: string
        default: "25.12.0"
      level:
        description: "Reviewdog report level [info, warning, error]"
        required: false
        type: string
        default: "error"

permissions:
  contents: read

jobs:
  black:
    name: Black Formatter
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write # to post Black formatting annotations on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ">=0.13.4" # emSign root CA removal (GHSA-hq85-5cpj-mr62)
          enable-cache: false

      # reviewdog/action-black uses black from PATH, else falls back to system pip.
      - name: Install Black
        run: |
          uv tool install "black==${BLACK_VERSION}"
          uv tool dir --bin >> "$GITHUB_PATH"
        env:
          BLACK_VERSION: ${{ inputs.black_version || '25.12.0' }}

      - uses: reviewdog/action-black@5059d92f0326f09326be64e1c50693374c7771cb # v3.24.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          level: ${{ inputs.level || 'error' }}
          filter_mode: added
          fail_on_error: true
