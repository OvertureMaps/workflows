---
# Labels issues opened by non-org-members across every OvertureMaps repo the
# label-external-issues GitHub App is installed on.
#
# Runs as a scheduled batch job (no per-repo `issues: opened` trigger needed)
# using the search API, so adding it here covers all repos at once. Logic
# lives in .github/actions/label-external-issues; see its README for details.
#
# Auth: assumes a narrow OIDC role that can only read the dedicated app's PEM
# from Secrets Manager. The role, secret, and app are managed in
# omf-github-terraform.
#
name: Label External Issues

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log intended changes without applying them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read # to check out the labeling action

concurrency:
  group: label-external-issues
  cancel-in-progress: false

jobs:
  label:
    name: Label issues from non-members
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write # for OIDC authentication with AWS
    env:
      # Client ID of the org's label-external-issues GitHub App (not sensitive).
      LABEL_EXTERNAL_APP_CLIENT_ID: "TODO-set-after-app-creation"
      # Narrow OIDC role (omf-github-terraform oidc-aws.tf) that can only
      # read the label-external-issues PEM secret.
      LABEL_EXTERNAL_OIDC_ROLE_ARN: arn:aws:iam::816069134238:role/gha-label-external-issues-secrets-reader
      LABEL_EXTERNAL_PEM_SECRET_ID: omf-github-terraform/label-external-issues/pem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/label-external-issues

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: us-west-2
          role-to-assume: ${{ env.LABEL_EXTERNAL_OIDC_ROLE_ARN }}

      # Exports the PEM as env.LABEL_EXTERNAL_PEM, masked (incl. multi-line).
      - name: Fetch label-external-issues PEM from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            LABEL_EXTERNAL_PEM,${{ env.LABEL_EXTERNAL_PEM_SECRET_ID }}

      - name: Label external issues
        uses: $/.github/actions/label-external-issues
        with:
          clientId: ${{ env.LABEL_EXTERNAL_APP_CLIENT_ID }}
          privateKey: ${{ env.LABEL_EXTERNAL_PEM }}
          dryRun: ${{ inputs.dry_run || 'false' }}
