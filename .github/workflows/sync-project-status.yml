---
# Keeps the Status field in sync for issues that belong to more than one
# Overture ProjectV2 (currently Overture #84 and places-surge #78).
#
# ProjectsV2 has no workflow trigger for field edits, so this runs as a
# scheduled batch job. Sync logic lives in .github/actions/sync-project-status;
# see its README for behavior and conflict resolution details.
#
# Auth: assumes an IAM role via OIDC and fetches the GitHub App PEM from
# AWS Secrets Manager. Requires these repo Actions variables:
#   - PROJECT_STATUS_SYNC_APP_CLIENT_ID: GitHub App client ID
#   - PROJECT_STATUS_SYNC_OIDC_ROLE_ARN: IAM role with secretsmanager:GetSecretValue
#   - PROJECT_STATUS_SYNC_PEM_SECRET_ID: Secrets Manager secret holding the PEM
#
name: Sync Project Status

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log intended changes without applying them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read # to check out the sync action

concurrency:
  group: sync-project-status
  cancel-in-progress: false

jobs:
  sync:
    name: Sync statuses
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for OIDC authentication with AWS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/sync-project-status

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.PROJECT_STATUS_SYNC_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Read app PEM from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            PROJECT_STATUS_SYNC_APP_PEM,${{ vars.PROJECT_STATUS_SYNC_PEM_SECRET_ID }}
          name-transformation: none

      - name: Sync project statuses
        uses: ./.github/actions/sync-project-status
        with:
          clientId: ${{ vars.PROJECT_STATUS_SYNC_APP_CLIENT_ID }}
          privateKey: ${{ env.PROJECT_STATUS_SYNC_APP_PEM }}
          dryRun: ${{ inputs.dry_run || 'false' }}
