---
# Keeps the Status field in sync for issues that belong to more than one
# Overture ProjectV2 (currently Overture #84, places-surge #78,
# CloudDevOps #54, and Road to schema v2.0.0 and extensions #85).
#
# ProjectsV2 has no workflow trigger for field edits, so this runs as a
# scheduled batch job. Sync logic lives in .github/actions/sync-project-status;
# see its README for behavior and conflict resolution details.
#
# Auth: assumes a narrow OIDC role that can only read the
# overture-project-manager GH App PEM from Secrets Manager. The role,
# secret, and app are managed in omf-github-terraform.
#
name: Sync Project Status

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log intended changes without applying them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read # to check out the sync action

concurrency:
  group: sync-project-status
  cancel-in-progress: false

jobs:
  sync:
    name: Sync statuses
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write # for OIDC authentication with AWS
    env:
      # Client ID of the org's overture-project-manager GitHub App (not sensitive).
      PROJECT_MANAGER_APP_CLIENT_ID: "Iv23limfwiJlCIqHPHrd"
      # Narrow OIDC role (omf-github-terraform oidc-aws.tf) that can only
      # read the project-manager PEM secret.
      PROJECT_MANAGER_OIDC_ROLE_ARN: arn:aws:iam::816069134238:role/gha-project-manager-secrets-reader
      PROJECT_MANAGER_PEM_SECRET_ID: omf-github-terraform/project-manager/pem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/sync-project-status

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: ${{ env.PROJECT_MANAGER_OIDC_ROLE_ARN }}

      # Exports the PEM as env.PROJECT_MANAGER_PEM, masked (incl. multi-line).
      - name: Fetch project-manager PEM from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            PROJECT_MANAGER_PEM,${{ env.PROJECT_MANAGER_PEM_SECRET_ID }}

      - name: Sync project statuses
        uses: ./.github/actions/sync-project-status
        with:
          clientId: ${{ env.PROJECT_MANAGER_APP_CLIENT_ID }}
          privateKey: ${{ env.PROJECT_MANAGER_PEM }}
          dryRun: ${{ inputs.dry_run || 'false' }}
