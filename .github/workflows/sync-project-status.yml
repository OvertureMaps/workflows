---
# Keeps the Status field in sync for issues that belong to more than one
# Overture ProjectV2 (currently Overture #84 and places-surge #78).
#
# ProjectsV2 has no workflow trigger for field edits, so this runs as a
# scheduled batch job. Sync logic lives in .github/actions/sync-project-status;
# see its README for behavior, conflict resolution, and the GitHub App setup
# required for vars.PROJECT_STATUS_SYNC_APP_CLIENT_ID and
# secrets.PROJECT_STATUS_SYNC_APP_PEM.
#
name: Sync Project Status

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log intended changes without applying them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read # to check out the sync action

concurrency:
  group: sync-project-status
  cancel-in-progress: false

jobs:
  sync:
    name: Sync statuses
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/sync-project-status

      - name: Sync project statuses
        uses: ./.github/actions/sync-project-status
        with:
          clientId: ${{ vars.PROJECT_STATUS_SYNC_APP_CLIENT_ID }}
          privateKey: ${{ secrets.PROJECT_STATUS_SYNC_APP_PEM }} # zizmor: ignore[secrets-outside-env]
          dryRun: ${{ inputs.dry_run || 'false' }}
