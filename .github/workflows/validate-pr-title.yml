---
# Reusable workflow to validate PR titles against Overture's formatting standards.
#
# This workflow accepts both the legacy [TYPE] bracket format and the
# Conventional Commits colon syntax, and provides helpful feedback comments
# when validation fails. It's the permissive, dual-syntax layer used while
# repos migrate from [TYPE] to Conventional Commits at their own pace; repos
# that only want to accept Conventional Commits titles should require
# Overture PR Checks (v2) (validate-pr-title-cc.yml) instead.
#
# Legacy syntax:
#   Required format: [TYPE] Description (Fixes #issue)
#   Optional scope:  [TYPE](scope) Description (Fixes #issue)
#   Breaking change: [BREAKING][TYPE] Description (Fixes #issue)
#
# Conventional Commits syntax (https://www.conventionalcommits.org/en/v1.0.0/):
#   Required format: type: Description
#   Optional scope:  type(scope): Description
#   Breaking change: type(scope)!: Description
#
# Usage: Reference this workflow from any repo in the OvertureMaps organization.
#
# Example (.github/workflows/pr-validation.yml):
#   name: PR Title Validation
#   on:
#     pull_request:
#       types: [opened, reopened, edited, synchronize]
#   jobs:
#     validate-title:
#       uses: OvertureMaps/workflows/.github/workflows/validate-pr-title.yml@main
#
name: Validate PR Title

on: # zizmor: ignore[concurrency-limits]
  workflow_call:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - reopened
      - edited
      - synchronize

# pull_request_target runs with write permissions so this workflow works for fork PRs.
# SECURITY: This workflow must never check out or execute code from the PR branch.
# If you need to add a step that does so, use the workflow_run pattern instead.
permissions:
  contents: none # no repository content access needed

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest
    permissions:
      contents: none # no repository content access needed
      pull-requests: write # to post PR title validation comments
      issues: write # to post PR-related issue comments via sticky comment action
      statuses: write # to update commit status checks
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Matches both Overture's legacy [TYPE] bracket format and the
          # Conventional Commits colon syntax:
          #   [BUG] Fix something
          #   [REFACTOR](schema) Consolidate logic
          #   [BREAKING][FEATURE] Change API response format
          #   fix: Correct null pointer exception
          #   refactor(schema): Consolidate logic
          #   refactor(schema)!: Drop support for legacy category format
          #
          # NOTE: amannn/action-semantic-pull-request maps headerPattern's
          # capture groups to headerPatternCorrespondence by fixed index
          # (via conventional-changelog), and Node's regex engine has no
          # "branch reset" grouping. That means this single pattern can't
          # cleanly say "try the bracket format, else try the colon format"
          # with independently-numbered groups; it has to reuse the same
          # three groups (type, scope, subject) across both syntaxes. The
          # tradeoff: this pattern is intentionally lenient at the edges and
          # will also accept a few malformed hybrids that are valid in
          # neither spec alone, e.g. `[BUG]: subject` or `fix] subject`. A
          # strictly-separate validator for each syntax would need two
          # independent jobs/steps, which duplicates this reusable
          # workflow's single-job structure.
          headerPattern: '^\[?(?:BREAKING\]\[)?(\w+)\]?(?:\(([^)]+)\))?!?:?\s(.+)$'
          headerPatternCorrespondence: type, scope, subject
          requireScope: false
          # Allowed types: Overture's legacy [TYPE] words (github-usage.md)
          # plus their Conventional Commits equivalents. INVESTIGATION has no
          # Conventional Commits equivalent and isn't accepted going forward.
          types: |
            BUG
            FEATURE
            ENHANCEMENT
            DOCS
            REFACTOR
            TEST
            CHORE
            PERFORMANCE
            SECURITY
            INVESTIGATION
            fix
            feat
            docs
            refactor
            test
            chore
            perf

          # Allow [WIP] prefix for draft work on repos without draft PR support.
          wip: true

          # Allow opt-out via labels, since some repos may have automated PRs that don't follow the new format.
          ignoreLabels: |
            bot
            ignore-semantic-pull-request

      - name: Post validation failure comment
        if: ${{ failure() && steps.lint_pr_title.outputs.error_message }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-validation-error
          message: |
            ## ❌ PR Title Validation Failed

            **Error:** ${{ steps.lint_pr_title.outputs.error_message }}

            ---

            **Examples:**
            - `[BUG] Fix null pointer exception in geometry validator`
            - `[REFACTOR](schema) Consolidate validation logic`
            - `fix: Correct null pointer exception in geometry validator`
            - `refactor(schema): Consolidate validation logic`

            See the [Overture Maps Foundation GitHub usage guidelines](https://github.com/OvertureMaps/operating-procedures/blob/main/development/github-usage.md) or the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) for full documentation.

      - name: Delete comment on success
        if: ${{ success() }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-validation-error
          delete: true
