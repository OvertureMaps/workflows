---
version: 2
updates:

  # Maintain workflow and composite action dependencies
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gha-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "bot"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
