name: Build and Publish Maven Project to CodeArtifact
description: >
  Builds this project from source and publishes its artifacts to AWS CodeArtifact.
  Handles Java setup and CodeArtifact authentication internally — suitable for
  drop-in use in any Maven project workflow.

inputs:
  aws-role-arn:
    description: IAM role ARN to assume via OIDC for CodeArtifact access
    required: true
  aws-region:
    description: AWS region where CodeArtifact is hosted
    required: false
    default: us-west-2
  codeartifact-domain:
    description: CodeArtifact domain name
    required: true
  codeartifact-domain-owner:
    description: AWS account ID that owns the CodeArtifact domain
    required: true
  codeartifact-repository:
    description: CodeArtifact repository name
    required: true
  maven-repository-id:
    description: >
      The Maven <server>/<repository> id used for CodeArtifact auth and
      deploy. Must match the id a consuming pom.xml's
      <repositories><repository> declares, otherwise Maven will not attach
      CodeArtifact credentials when resolving dependencies. Defaults to
      "codeartifact", the convention documented across consuming repos.
    required: false
    default: codeartifact
  version:
    description: >
      Optional artifact version. When set, the pom version is overridden via
      `mvn versions:set` and the project is built with dev naming. When empty,
      the project's release version is published unchanged. Mutually exclusive
      with `revision`.
    required: false
    default: ""
  revision:
    description: >
      Optional value for the `-Drevision` property, for poms that use the
      CI-friendly `${revision}` version placeholder instead of a hardcoded
      version. Passed straight through to `mvn deploy` rather than rewriting
      the pom via `versions:set`. Mutually exclusive with `version`.
    required: false
    default: ""
  profiles:
    description: >
      Comma-separated list of Maven profiles to activate, passed as `-P` (e.g.
      `spark35` or `spark35,extra-profile`).
    required: false
    default: ""
  projects:
    description: >
      Comma-separated list of Maven reactor projects to build, passed as
      `-pl`. Use this to build a single module from a multi-module pom instead
      of `working-directory`, e.g. when profiles live in the root pom and the
      module can't be built standalone. When set, the manifest step looks for
      the JAR under `<projects>/target` instead of `target`.
    required: false
    default: ""
  working-directory:
    description: >
      Directory containing the Maven project (its pom.xml and .java-version).
      Defaults to the repository root. Set this to publish a project that lives
      in a subdirectory.
    required: false
    default: "."
  java-version:
    description: >
      Optional JDK version to use, overriding the `.java-version` file in
      `working-directory`. Set this when the same tree needs different JDKs
      for different matrix rows (e.g. Java 11 for one Spark line, 17 for
      another).
    required: false
    default: ""
  commit:
    description: >
      Commit SHA recorded as `build.commit` in the JAR manifest. Defaults to the
      checked-out workspace HEAD (`git rev-parse HEAD`), which matches the tree
      actually built — unlike `github.sha`, which is the merge-ref SHA on
      `pull_request` events. Override only if the build tree is not a git
      checkout.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: "temurin"
        java-version: ${{ inputs.java-version }}
        java-version-file: ${{ inputs.java-version == '' && format('{0}/.java-version', inputs.working-directory) || '' }}
        cache: maven
        cache-dependency-path: "${{ inputs.working-directory }}/pom.xml"

    - name: Authenticate with CodeArtifact
      uses: OvertureMaps/workflows/.github/actions/setup-codeartifact@main # zizmor: ignore[unpinned-uses] -- trusted same-repo self-reference; pinned to the branch-protected default branch by design
      with:
        aws-role-arn: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        codeartifact-domain: ${{ inputs.codeartifact-domain }}
        codeartifact-domain-owner: ${{ inputs.codeartifact-domain-owner }}
        codeartifact-repository: ${{ inputs.codeartifact-repository }}
        maven-repository-id: ${{ inputs.maven-repository-id }}

    - name: Set dev version
      if: ${{ inputs.version != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION: ${{ inputs.version }}
      run: |
        mvn versions:set -ntp \
          -DnewVersion="$VERSION" \
          -DgenerateBackupPoms=false \
          --settings ~/.m2/settings.xml

    - name: Build and Deploy to CodeArtifact
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MAVEN_REPOSITORY_ID: ${{ inputs.maven-repository-id }}
        CODEARTIFACT_REPO_URL: "https://${{ inputs.codeartifact-domain }}-${{ inputs.codeartifact-domain-owner }}.d.codeartifact.${{ inputs.aws-region }}.amazonaws.com/maven/${{ inputs.codeartifact-repository }}/"
        BUILD_ENV: ${{ (inputs.version != '' || inputs.revision != '') && 'dev' || 'release' }}
        BUILD_BRANCH: ${{ github.ref_name }}
        COMMIT_OVERRIDE: ${{ inputs.commit }}
        WORKFLOW_RUN_ID: ${{ github.run_id }}
        WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
        REVISION: ${{ inputs.revision }}
        PROFILES: ${{ inputs.profiles }}
        PROJECTS: ${{ inputs.projects }}
      run: |
        # Default build.commit to the checked-out HEAD so the manifest matches the
        # tree actually built. On pull_request, github.sha is the merge-ref SHA.
        BUILD_COMMIT="$COMMIT_OVERRIDE"
        if [ -z "$BUILD_COMMIT" ]; then
          BUILD_COMMIT=$(git rev-parse HEAD)
        fi

        args=(clean deploy -ntp
          -DaltDeploymentRepository="$MAVEN_REPOSITORY_ID::$CODEARTIFACT_REPO_URL"
          -Dbuild.branch="$BUILD_BRANCH"
          -Dbuild.commit="$BUILD_COMMIT"
          -Dworkflow.run_id="$WORKFLOW_RUN_ID"
          -Dworkflow.run_number="$WORKFLOW_RUN_NUMBER"
          -Dmaven.test.skip="true"
          -Denv="$BUILD_ENV"
          --settings ~/.m2/settings.xml)

        [ -n "$REVISION" ] && args+=(-Drevision="$REVISION")
        [ -n "$PROFILES" ] && args+=(-P"$PROFILES")
        [ -n "$PROJECTS" ] && args+=(-pl "$PROJECTS")

        mvn "${args[@]}"

    - name: Print JAR Manifest Entries
      shell: bash
      env:
        PROJECTS: ${{ inputs.projects }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        # Profiles built from the root pom (`-pl`) put artifacts under the
        # module's own target/, not the root's.
        TARGET_DIR="target"
        if [ -n "$PROJECTS" ]; then
          TARGET_DIR="${PROJECTS%%,*}/target"
        fi
        TARGET_DIR="$WORKING_DIRECTORY/$TARGET_DIR"

        JAR_FILE=$(find "$TARGET_DIR" -name "*-shaded.jar" -print -quit 2>/dev/null)
        if [ -z "$JAR_FILE" ]; then
          JAR_FILE=$(find "$TARGET_DIR" -maxdepth 1 -name "*.jar" -print -quit 2>/dev/null)
        fi
        if [ -z "$JAR_FILE" ]; then
          echo "::warning::No JAR found in $TARGET_DIR; skipping manifest printout."
          exit 0
        fi
        echo "Extracting MANIFEST.MF from $JAR_FILE..."
        unzip -p "$JAR_FILE" META-INF/MANIFEST.MF
