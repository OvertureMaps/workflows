---
name: s5cmd
description: >
  Install and run s5cmd operations (cp, mv, rm, ls, sync, run) against
  S3-compatible storage. Assumes AWS credentials are already configured in
  the environment (e.g. via aws-actions/configure-aws-credentials).

inputs:
  command:
    description: |
      s5cmd subcommand to run. Must be one of: cp, mv, rm, ls, sync, run.

      cp, mv, rm, ls, sync map directly to their aws s3 equivalents.

      run (batch mode): executes a file of s5cmd commands concurrently — one
      command per line, in the same syntax as the other subcommands. This is
      the highest-throughput option: pass a manifest file as `batch-file` and
      s5cmd will parallelise all commands simultaneously. No `source` or
      `destination` needed. Example manifest line:
      "cp s3://src/a.parquet s3://dst/a.parquet"
    required: true
  source:
    description: >
      Source path for cp, mv, rm, ls, and sync: a local file path or an
      S3 URI (s3://bucket/key). Not used with the run command (use batch-file
      instead). Omit for commands that take no source (e.g. ls).
    required: false
    default: ""
  destination:
    description: >
      Destination path: a local file path or an S3 URI (s3://bucket/key).
      Required for cp, mv, and sync. Omit for commands that take no destination (e.g. ls).
    required: false
    default: ""
  batch-file:
    description: >
      Path to a manifest file for use with the run command only. Each line
      contains one s5cmd command (e.g. "cp s3://src/a.parquet s3://dst/a.parquet").
      Not used with cp, mv, rm, ls, or sync (use source instead).
    required: false
    default: ""
  flags:
    description: >
      Global flags to pass to s5cmd before the subcommand, as a single string.
      Examples: "--no-sign-request", "--credentials-file /path/to/creds". If
      "--delete" is passed here with the sync command, it's automatically
      moved after the subcommand (where s5cmd requires it) with a warning;
      use 'subcommand-flags' instead to avoid the warning. Split on
      whitespace, not shell quoting rules; don't pass flag values containing
      spaces (e.g. quoted strings) here.
    required: false
    default: ""
  subcommand-flags:
    description: >
      Flags to pass to the s5cmd subcommand itself, placed after the
      subcommand and before source/destination, as a single string. These are
      distinct from 'flags' (global flags before the subcommand): s5cmd
      subcommands take their own flags, e.g. "sync --delete". Not used with
      the run command, since its batch-file lines carry their own per-command
      flags. Example: "--delete" for sync. Split on whitespace, not shell
      quoting rules; don't pass flag values containing spaces (e.g. quoted
      strings) here.
    required: false
    default: ""
  version:
    description: >
      s5cmd version to install. Pinned to 2.3.0 by default. Override only
      when a specific version is needed; prefer the default to ensure
      reproducible builds.
    required: false
    default: "2.3.0"

runs:
  using: composite
  steps:
    - name: Install s5cmd v${{ inputs.version }}
      uses: peak/action-setup-s5cmd@bde462e7399c68b4a9b05549d90b0e7d5c95e60f # zizmor: ignore[stale-action-refs] — upstream has no releases or tags; main
      with:
        version: v${{ inputs.version }}

    - name: Validate inputs
      shell: bash
      run: |
        CMD="${INPUTS_COMMAND}"
        SRC="${INPUTS_SOURCE}"
        DST="${INPUTS_DESTINATION}"
        BATCH="${INPUTS_BATCH_FILE}"
        SUBCMD_FLAGS="${INPUTS_SUBCOMMAND_FLAGS}"

        case "$CMD" in
          cp|mv|rm|ls|sync|run) ;;
          *)
            echo "::error::Unsupported s5cmd command: '${CMD}'. Must be one of: cp, mv, rm, ls, sync, run."
            exit 1
            ;;
        esac

        if [[ "$CMD" == "run" && -z "$BATCH" ]]; then
          echo "::error::The 'run' command requires the 'batch-file' input."
          exit 1
        fi
        if [[ "$CMD" == "run" && ( -n "$SRC" || -n "$DST" ) ]]; then
          echo "::error::The 'run' command does not use 'source' or 'destination'. Use 'batch-file' instead."
          exit 1
        fi
        if [[ "$CMD" != "run" && -n "$BATCH" ]]; then
          echo "::error::'batch-file' is only valid with the 'run' command. Did you mean to use 'source'?"
          exit 1
        fi
        if [[ "$CMD" == "run" && -n "$SUBCMD_FLAGS" ]]; then
          echo "::error::'subcommand-flags' is not valid with the 'run' command. Put per-command flags inline in the batch-file instead."
          exit 1
        fi
      env:
        INPUTS_COMMAND: ${{ inputs.command }}
        INPUTS_SOURCE: ${{ inputs.source }}
        INPUTS_DESTINATION: ${{ inputs.destination }}
        INPUTS_BATCH_FILE: ${{ inputs.batch-file }}
        INPUTS_SUBCOMMAND_FLAGS: ${{ inputs.subcommand-flags }}

    - name: s5cmd ${{ inputs.command }}
      shell: bash
      run: |
        CMD="${INPUTS_COMMAND}"
        SRC="${INPUTS_SOURCE}"
        DST="${INPUTS_DESTINATION}"
        BATCH="${INPUTS_BATCH_FILE}"
        FLAGS="${INPUTS_FLAGS}"
        SUBCMD_FLAGS="${INPUTS_SUBCOMMAND_FLAGS}"

        # Split on whitespace only, no shell quoting; see input descriptions
        # above for the flag-value-with-spaces limitation this implies.
        FLAG_ARRAY=()
        [[ -n "$FLAGS" ]] && read -ra FLAG_ARRAY <<< "$FLAGS"

        SUBCMD_FLAG_ARRAY=()
        [[ -n "$SUBCMD_FLAGS" ]] && read -ra SUBCMD_FLAG_ARRAY <<< "$SUBCMD_FLAGS"

        # --delete is a sync-subcommand flag, not global, but callers written
        # against the old (pre-subcommand-flags) 'flags' input still pass it
        # there. Auto-correct that one known case so existing callers keep
        # working; anything else misplaced in 'flags' still fails as before.
        if [[ "$CMD" == "sync" ]]; then
          CORRECTED_FLAG_ARRAY=()
          for flag in "${FLAG_ARRAY[@]}"; do
            if [[ "$flag" == "--delete" ]]; then
              echo "::warning::'--delete' is a sync-subcommand flag, not a global one; moving it after 'sync' automatically. Pass it via 'subcommand-flags' instead of 'flags' to avoid this warning."
              SUBCMD_FLAG_ARRAY+=("--delete")
            else
              CORRECTED_FLAG_ARRAY+=("$flag")
            fi
          done
          FLAG_ARRAY=("${CORRECTED_FLAG_ARRAY[@]}")
        fi

        # Build argument array: global flags, then subcommand, then subcommand flags, then positional args
        ARGS=()
        ARGS+=("${FLAG_ARRAY[@]}")
        ARGS+=("$CMD")

        if [[ "$CMD" == "run" ]]; then
          ARGS+=("$BATCH")
        else
          ARGS+=("${SUBCMD_FLAG_ARRAY[@]}")
          [[ -n "$SRC" ]] && ARGS+=("$SRC")
          [[ -n "$DST" ]] && ARGS+=("$DST")
        fi

        echo "Running: s5cmd ${ARGS[*]}"
        s5cmd "${ARGS[@]}"
      env:
        INPUTS_COMMAND: ${{ inputs.command }}
        INPUTS_SOURCE: ${{ inputs.source }}
        INPUTS_DESTINATION: ${{ inputs.destination }}
        INPUTS_BATCH_FILE: ${{ inputs.batch-file }}
        INPUTS_FLAGS: ${{ inputs.flags }}
        INPUTS_SUBCOMMAND_FLAGS: ${{ inputs.subcommand-flags }}
