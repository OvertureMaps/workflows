---
name: Parse Issue Form
description: >
  Fetches an issue and parses its issue-form answers into structured data
  (form field answers, existing repo-level type, existing org-level field
  values), for other actions to build issue-form-driven automation on top of.

inputs:
  github-token:
    description: >
      Token with read access to the repo, used to fetch the issue. Composite
      action inputs cannot default to the github.token context, so callers
      must pass one explicitly, e.g. secrets.GITHUB_TOKEN.
    required: true
  issue-number:
    description: >
      Issue number to fetch and parse. Defaults to the triggering issue
      (context.issue.number). Override for testing or non-issue-event triggers.
    required: false
    default: ""

outputs:
  issue-number:
    description: The issue number that was fetched (resolved issue-number input or context.issue.number)
    value: ${{ steps.fetch-issue.outputs.issue-number }}
  answers:
    description: >
      JSON object mapping issue form field `id` to its answer, e.g.
      {"type": "Bug", "scope": "Base"}. Empty object ({}) if the issue has
      no parseable form answers at all (no template used, a free-form issue,
      or a template with no matching fields) — always check for this before
      assuming a template was used.
    value: ${{ steps.issue-parser.outputs.jsonString }}
  type-name:
    description: The issue's existing repo-level type name, or empty if unset
    value: ${{ steps.fetch-issue.outputs.type-name }}
  field-values:
    description: >
      JSON array of the issue's existing org-level issue_field_values (each
      with issue_field_id, issue_field_name, value, etc.), or [] if none are set.
    value: ${{ steps.fetch-issue.outputs.field-values }}

runs:
  using: composite
  steps:
    - name: Fetch issue
      id: fetch-issue
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const issueNumber = parseInt(core.getInput('issue-number')) || context.issue.number;
          const { owner, repo } = context.repo;
          const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });

          core.setOutput('issue-number', issueNumber);
          core.setOutput('body', issue.body ?? '');
          core.setOutput('type-name', issue.type?.name ?? '');
          core.setOutput('field-values', JSON.stringify(issue.issue_field_values ?? []));

    - name: Parse issue form
      id: issue-parser
      uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3.2.5
      with:
        issue-body: ${{ steps.fetch-issue.outputs.body }}
